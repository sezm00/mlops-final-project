          - MonthlyCharges
          - TotalCharges
          - AvgMonthlyCharges
          - ChargeDeviation
          - TotalCharges_log
          - NumServices
          - IsHighValueCustomer
          imputer_strategy: median
          use_smote: true
          smote_k_neighbors: 5
        split.random_state: 42
        split.test_size: 0.2
        stat_features:
          high_value_quantile: 0.75
