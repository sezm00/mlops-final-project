stages:
  prepare:
    cmd: python src/data/prepare.py
    deps:
    - src/data/prepare.py
    - configs/params.yaml
    - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
    outs:
    - data/processed/cleaned_reference.csv
    - data/splits/production.csv
  featurize:
    cmd: python -m src.features.featurize
    deps:
    - src/features/featurize.py
    - src/features/feature_engineer.py
    - configs/params.yaml
    - data/processed/cleaned_reference.csv
    outs:
    - data/processed/featurized_reference.csv
    - models/feature_engineer.joblib
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
    - src/data/preprocess.py
    - configs/params.yaml
    - data/processed/featurized_reference.csv
    params:
    - configs/params.yaml:
      - stat_features
      - encoding
      - preprocessing
      - split.test_size
      - split.random_state
    outs:
    - data/splits/train.csv
    - data/splits/test.csv
    - models/preprocessing_pipeline.joblib
  train:
    cmd: python -m src.training.train --train-path data/splits/train.csv --test-path data/splits/test.csv --target-column Churn --model-dir models --report-dir reports
    deps:
    - src/training/train.py
    - src/training/mlflow_setup.py
    - src/evaluation/evaluate.py
    - src/evaluation/diagnostics.py
    - data/splits/train.csv
    - data/splits/test.csv
    outs:
    - models/best_model.pkl
    - models/best_reference_model.pkl
    - models/best_all_features_model.pkl
    - models/best_selected_feature_model.pkl
    - models/feature_columns.json
    - reports/best_model_summary.json
    - reports/selected_feature_model_summary.json
    - reports/mlflow_run_summary.csv
    - reports/model_diagnostics_report.json
    - reports/data_leakage_report.json
    - reports/feature_importance/all_feature_importance.csv
    - reports/feature_importance/top_10_feature_importance.csv
    - reports/feature_importance/top_10_features.json
    - reports/feature_importance/feature_selection_results.json
    - reports/feature_importance/selected_features.json
    metrics:
    - reports/metrics.json:
        cache: false
  hpo:
    cmd: python -m src.training.hpo --train-path data/splits/train.csv --test-path
      data/splits/test.csv --target-column Churn --model-dir models --report-dir
      reports --n-iter 6 --cv 3
    deps:
    - src/training/hpo.py
    - src/training/mlflow_setup.py
    - src/evaluation/evaluate.py
    - src/evaluation/diagnostics.py
    - data/splits/train.csv
    - data/splits/test.csv
    outs:
    - models/best_tuned_model.pkl
    - reports/hpo_summary.json
    - reports/hpo_diagnostics_report.json
  register:
    cmd: python -m src.training.register_model --experiment-name mlops_training_experiments
      --registered-model-name BestMLOpsModel --metric-name f1_macro --higher-is-better
      --selected-features-path reports/feature_importance/selected_features.json --best-model-summary-path
      reports/best_model_summary.json --registry-summary-path reports/model_registry_summary.json
    deps:
    - src/training/register_model.py
    - src/training/mlflow_setup.py
    - reports/feature_importance/selected_features.json
    - reports/best_model_summary.json
    outs:
    - reports/model_registry_summary.json
    always_changed: true
