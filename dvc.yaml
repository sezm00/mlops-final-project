# dvc.yaml
# ─────────────────────────────────────────────────────────────────────────────
# DVC Pipeline — Telco Churn MLOps
# Execution order: prepare → featurize → validate_schema → preprocess
# Run full pipeline : dvc repro
# View DAG          : dvc dag
# ─────────────────────────────────────────────────────────────────────────────

stages:

  # ── Stage 1: Cleaning + Split (NO features) ───────────────────────────────
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - src/data/prepare.py
      - configs/params.yaml
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
    outs:
      - data/splits/cleaned_reference.csv
      - data/splits/cleaned_production.csv


  # ── Stage 2: Feature Engineering (row-level + stat-level) ────────────────
  featurize:
    cmd: python src/features/featurize.py
    deps:
      - src/features/featurize.py
      - configs/params.yaml
      - data/splits/cleaned_reference.csv
      - data/splits/cleaned_production.csv
    outs:
      - data/splits/reference.csv
      - data/splits/production.csv
      - data/processed/reference_stats.json

  # ── Stage 3: Schema Validation (NO transformations) ──────────────────────
  validate_schema:
    cmd: python src/features/validate_schema.py
    deps:
      - src/features/validate_schema.py
      - configs/params.yaml
      - data/splits/reference.csv
      - data/splits/production.csv
    outs:
      - data/splits/.schema_validated.flag

  
  # ── Stage 4: Encoding + Scaling + SMOTE ───────────────────────────────────
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - configs/params.yaml
    
      - data/processed/reference_stats.json
      - data/splits/.schema_validated.flag 
    params:
      - configs/params.yaml:
          - stat_features
          - encoding
          - preprocessing
          - split.test_size
          - split.random_state
    outs:
      - data/splits/train.csv
      - data/splits/test.csv
      - data/splits/production_processed.csv
      - data/processed/preprocessing_pipeline.pkl