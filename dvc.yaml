# dvc.yaml
# ─────────────────────────────────────────────────────────────────────────────
# DVC Pipeline — Telco Churn MLOps
# Execution order: prepare → featurize  → preprocess
# Run full pipeline : dvc repro
# View DAG          : dvc dag
# ─────────────────────────────────────────────────────────────────────────────

stages:

 # ── Stage 1: Raw Split + Reference Cleaning (NO features) ───────────────────────────────
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - src/data/prepare.py
      - configs/params.yaml
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
    outs:
      - data/processed/cleaned_reference.csv
      - data/splits/production.csv

  featurize:
    # cmd: PYTHONPATH=. python -m src.features.featurize
    cmd: python -m src.features.featurize
    deps:
      - src/features/featurize.py
      - src/features/feature_engineer.py
      - configs/params.yaml
      - data/processed/cleaned_reference.csv
    outs:
      - data/processed/featurized_reference.csv
      - models/feature_engineer.joblib



  # ── Stage 3: Encoding + Scaling + SMOTE ───────────────────────────────────
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - configs/params.yaml
      - data/processed/featurized_reference.csv
  
      
    params:
      - configs/params.yaml:
          - stat_features
          - encoding
          - preprocessing
          - split.test_size
          - split.random_state
    outs:
      - data/splits/train.csv
      - data/splits/test.csv
      - models/preprocessing_pipeline.joblib