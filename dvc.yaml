stages:
  prepare:
    cmd: python src/training/prepare_stage.py --train-path data/splits/train.csv --test-path data/splits/test.csv --output-path reports/pipeline/prepare_summary.json
    deps:
      - src/training/prepare_stage.py
      - data/splits/train.csv
      - data/splits/test.csv
    outs:
      - reports/pipeline/prepare_summary.json

  preprocess:
    cmd: python src/training/preprocess_stage.py --train-path data/splits/train.csv --test-path data/splits/test.csv --target-column target --train-output-path data/processed/train_processed.csv --test-output-path data/processed/test_processed.csv --summary-path reports/pipeline/preprocess_summary.json
    deps:
      - src/training/preprocess_stage.py
      - data/splits/train.csv
      - data/splits/test.csv
    outs:
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
      - reports/pipeline/preprocess_summary.json

  featurize:
    cmd: python src/training/featurize_stage.py --train-path data/processed/train_processed.csv --test-path data/processed/test_processed.csv --target-column target --train-output-path data/features/train_features.csv --test-output-path data/features/test_features.csv --metadata-path reports/pipeline/feature_metadata.json
    deps:
      - src/training/featurize_stage.py
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
    outs:
      - data/features/train_features.csv
      - data/features/test_features.csv
      - reports/pipeline/feature_metadata.json

  train:
    cmd: python src/training/train.py --train-path data/features/train_features.csv --test-path data/features/test_features.csv --target-column target --model-dir models --report-dir reports
    deps:
      - src/training/train.py
      - src/training/mlflow_setup.py
      - src/evaluation/evaluate.py
      - src/evaluation/diagnostics.py
      - data/features/train_features.csv
      - data/features/test_features.csv
    outs:
      - models/best_model.pkl
      - models/feature_columns.json
      - reports/best_model_summary.json
      - reports/mlflow_run_summary.csv
      - reports/model_diagnostics_report.json
      - reports/data_leakage_report.json
      - reports/data_drift_report.json
    metrics:
      - reports/metrics.json:
          cache: false
