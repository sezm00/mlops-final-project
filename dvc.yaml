stages:
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - src/data/prepare.py

  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - data/splits/train.csv
      - data/splits/test.csv

  featurize:
    cmd: python -c "from pathlib import Path; assert Path('data/splits/train.csv').exists(), 'Missing data/splits/train.csv'; assert Path('data/splits/test.csv').exists(), 'Missing data/splits/test.csv'; print('Featurize stage validated existing feature-ready split files')"
    deps:
      - data/splits/train.csv
      - data/splits/test.csv

  train:
    cmd: python src/training/train.py --train-path data/splits/train.csv --test-path data/splits/test.csv --target-column target --model-dir models --report-dir reports
    deps:
      - src/training/train.py
      - src/training/mlflow_setup.py
      - src/evaluation/evaluate.py
      - src/evaluation/diagnostics.py
      - data/splits/train.csv
      - data/splits/test.csv
    outs:
      - models/best_model.pkl
      - models/feature_columns.json
      - reports/best_model_summary.json
      - reports/mlflow_run_summary.csv
      - reports/model_diagnostics_report.json
      - reports/data_leakage_report.json
      - reports/data_drift_report.json
    metrics:
      - reports/metrics.json:
          cache: false
