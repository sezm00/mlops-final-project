name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: "3.11"
  MIN_F1_MACRO: "0.70"

jobs:
# ---------------------------------------------------
# 1. LINT (fast feedback, runs independently)
# ---------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests monitoring

      - name: Ruff format check
        run: ruff format --check .

# ---------------------------------------------------
# 2. TESTS + COVERAGE (main quality gate)
# ---------------------------------------------------
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary -r requirements-dev.txt

      - name: Run pytest (coverage enforced)
        run: |
          pytest tests \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ---------------------------------------------------
# 3. DATA VALIDATION (runs only if tests pass)
# ---------------------------------------------------
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[all]"

      - name: Cache DVC artifacts
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}

      - name: Pull DVC data
        run: dvc pull

      - name: Run Great Expectations validation
        run: |
          python -c "
          import pandas as pd
          from src.data.great_expectations_suite import validate_reference_data

          df = pd.read_csv('data/processed/featurized_reference.csv')
          validate_reference_data(df)

          print('Data validation passed')
          "

# ---------------------------------------------------
# 4. MODEL VALIDATION (quality gate on metrics)
# ---------------------------------------------------
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: data-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[all]"

      - name: Cache DVC artifacts
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}

      - name: Pull DVC data
        run: dvc pull

      - name: Validate model quality
        run: |
          python - <<EOF
          import json, os, joblib
          from pathlib import Path

          model_path = Path('models/best_model.pkl')
          metrics_path = Path('reports/metrics.json')

          assert model_path.exists(), "Model file missing"
          model = joblib.load(model_path)
          assert hasattr(model, "predict"), "Model must implement predict"

          metrics = json.loads(metrics_path.read_text())
          f1 = float(metrics.get("f1_macro", 0))
          threshold = float(os.environ["MIN_F1_MACRO"])

          assert f1 >= threshold, f"f1_macro {f1:.3f} < {threshold:.3f}"

          print(f"Model validation passed: f1_macro={f1:.3f}")
          EOF

# ---------------------------------------------------
# 5. MONITORING (drift detection)
# ---------------------------------------------------
  monitoring:
    name: Monitoring & Drift Detection
    runs-on: ubuntu-latest
    needs: model-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[all]"

      - name: Cache DVC artifacts
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}

      - name: Pull DVC data
        run: dvc pull

      - name: Generate Evidently reports
        run: python monitoring/run_monitoring.py

      - name: Upload monitoring reports
        uses: actions/upload-artifact@v4
        with:
          name: evidently-reports
          path: monitoring/evidently_reports/

# ---------------------------------------------------
# 6. DOCKER BUILD + RUNTIME TEST
# ---------------------------------------------------
  docker:
    name: Docker Build & API Test
    runs-on: ubuntu-latest
    needs: monitoring

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t churn-api:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 8000:8000 --name churn-api churn-api:${{ github.sha }}

      - name: Wait for startup
        run: sleep 15

      - name: Healthcheck
        run: curl --fail http://localhost:8000/health

      - name: Prediction test (end-to-end)
        run: |
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"sample": "data"}' \
            --fail