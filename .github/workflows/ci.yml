name: CI Pipeline

on:
  push:
    branches:
      - "**"          # run everywhere (testing)
  pull_request:
    branches:
      - develop        # only run on PRs to develop (testing)

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      # -------------------------------------
      # 1. Checkout repo
      # -------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. Set up Python
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -------------------------------------
      # 3. Upgrade pip
      # -------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # -------------------------------------
      # 4. Install dependencies (DEV)
      # -------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      # -------------------------------------
      # 5. Lint (optional but recommended)
      # -------------------------------------
      - name: Lint code
        run: |
          pip install flake8
          flake8 src --max-line-length=100 --exclude=__pycache__

      # -------------------------------------
      # 6. Run tests
      # -------------------------------------
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings --cov=src

      # -------------------------------------
      # 7. Upload coverage (optional)
      # -------------------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage