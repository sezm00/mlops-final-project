name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: "3.11"
  MIN_F1_MACRO: "0.70"

# ===================================================
# GLOBAL AWS ENV (used by all jobs)
# ===================================================
jobs:

# ---------------------------------------------------
# 1. LINT
# ---------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests monitoring

      - name: Ruff format check
        run: ruff format --check .


# ---------------------------------------------------
# 2. TESTS
# ---------------------------------------------------
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v


# ---------------------------------------------------
# 3. DATA VALIDATION
# ---------------------------------------------------
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: tests

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[s3]"

      - name: Cache DVC
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}

      - name: Pull DVC data (safe retry)
        run: |
          dvc pull --retry 3


      - name: Run Great Expectations validation
        run: |
          python -c "
          import pandas as pd
          from src.data.great_expectations_suite import validate_reference_data

          df = pd.read_csv('data/processed/featurized_reference.csv')
          validate_reference_data(df)

          print('Data validation passed')
          "


# ---------------------------------------------------
# 4. MODEL VALIDATION
# ---------------------------------------------------
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: data-validation

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[s3]"

      - name: Cache DVC
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}

      - name: Pull DVC data (safe retry)
        run: dvc pull --retry 3

      - name: Validate model quality
        run: |
          python - <<EOF
          import json, os
          from pathlib import Path
          import joblib

          model_path = Path('models/best_model.pkl')
          metrics_path = Path('reports/metrics.json')

          # ---- Guard: model must exist
          if not model_path.exists():
              raise FileNotFoundError("Model file missing")

          model = joblib.load(model_path)
          assert hasattr(model, "predict"), "Model must implement predict"

          # ---- Guard: metrics file (strict fail, NOT silent)
          if not metrics_path.exists():
              raise FileNotFoundError("metrics.json missing - training step failed")

          metrics = json.loads(metrics_path.read_text())
          f1 = float(metrics.get("f1_macro", 0))

          threshold = float(os.environ.get("MIN_F1_MACRO", 0.70))

          assert f1 >= threshold, f"f1_macro {f1:.3f} < {threshold:.3f}"

          print(f"Model validation passed: f1_macro={f1:.3f}")
          EOF


# ---------------------------------------------------
# 5. MONITORING
# ---------------------------------------------------
  monitoring:
    name: Monitoring & Drift Detection
    runs-on: ubuntu-latest
    needs: model-validation

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[s3]"

      - name: Cache DVC
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}

      - name: Pull DVC data (safe retry)
        run: dvc pull --retry 3

      - name: Run monitoring
        run: python monitoring/run_monitoring.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: evidently-reports
          path: monitoring/evidently_reports/


# ---------------------------------------------------
# 6. DOCKER
# ---------------------------------------------------
  docker:
    name: Docker Build & API Test
    runs-on: ubuntu-latest
    needs: monitoring

    steps:
      - uses: actions/checkout@v4

      - name: Pull DVC data (required for model)
        run: |
          pip install "dvc[s3]"
          dvc pull --retry 3

      - name: Build Docker image
        run: docker build --pull -t churn-api:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 8000:8000 --name churn-api churn-api:${{ github.sha }}

      - name: Wait for API (robust healthcheck)
        run: |
          for i in {1..10}; do
            curl --fail http://localhost:8000/health && exit 0
            sleep 3
          done
          exit 1