name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: "3.11"
  MIN_F1_MACRO: "0.70"

jobs:

# ---------------------------------------------------
# 1. LINT (simple)
# ---------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests monitoring


# ---------------------------------------------------
# 2. TESTS
# ---------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests -v


# ---------------------------------------------------
# 3. DATA VALIDATION
# ---------------------------------------------------
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[all]"

      - name: Pull DVC data
        run: dvc pull

      - name: Run validation
        run: |
          python -c "
          import pandas as pd
          from src.data.great_expectations_suite import validate_reference_data

          df = pd.read_csv('data/processed/featurized_reference.csv')
          validate_reference_data(df)

          print('Data validation passed')
          "


# ---------------------------------------------------
# 4. MODEL VALIDATION (SAFE)
# ---------------------------------------------------
  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: data-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[all]"

      - name: Pull DVC data
        run: dvc pull

      - name: Validate model (safe mode)
        run: |
          python - <<EOF
          import json, os
          from pathlib import Path
          import joblib

          model_path = Path("models/best_model.pkl")
          metrics_path = Path("reports/metrics.json")

          # ------------------------
          # Check model exists
          # ------------------------
          if not model_path.exists():
              print("Model not found → skipping validation")
              exit(0)

          model = joblib.load(model_path)

          if not hasattr(model, "predict"):
              raise ValueError("Invalid model file")

          # ------------------------
          # If metrics missing → skip safely
          # ------------------------
          if not metrics_path.exists():
              print("metrics.json missing → skipping validation")
              exit(0)

          try:
              metrics = json.loads(metrics_path.read_text())
          except Exception:
              print("metrics.json invalid → skipping validation")
              exit(0)

          f1 = float(metrics.get("f1_macro", 0))
          threshold = float(os.environ.get("MIN_F1_MACRO", "0.70"))

          if f1 < threshold:
              raise AssertionError(f"f1_macro {f1:.3f} < {threshold:.3f}")

          print(f"Model validation passed: f1_macro={f1:.3f}")
          EOF


# ---------------------------------------------------
# 5. MONITORING
# ---------------------------------------------------
  monitoring:
    name: Monitoring
    runs-on: ubuntu-latest
    needs: model-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies + DVC + Evidently
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install "dvc[all]"
          pip install evidently

      - name: Pull DVC data
        run: dvc pull

      - name: Run monitoring
        run: python monitoring/run_monitoring.py
